server:
  port: ${IMAGE_SERVICE_PORT:8082}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  # 本地开发读取项目根目录的 .env（IDEA 与命令行都不必再配环境变量）；正式环境用真实环境变量，优先级高于该文件
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  application:
    name: picture-image-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${IMAGE_MYSQL_HOST:127.0.0.1}:${IMAGE_MYSQL_PORT:3306}/${IMAGE_MYSQL_DATABASE:picture_image}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${IMAGE_MYSQL_USERNAME:root}
    password: ${IMAGE_MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${IMAGE_MAX_FILE_SIZE:10MB}
      max-request-size: ${IMAGE_MAX_REQUEST_SIZE:12MB}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

picture:
  auth:
    # 免登录请求白名单，格式为 "METHOD /path"，多个用逗号分隔；仅公开分享读取
    public-requests: "GET /image/share/**"
  session:
    ttl-seconds: ${SESSION_TTL_SECONDS:604800}
  upload:
    # 业务侧的文件大小校验，与 multipart 限制同源，避免改大限制后这里仍按旧值拒绝
    max-file-size: ${IMAGE_MAX_FILE_SIZE:10MB}
  internal:
    # 服务间内部接口令牌，调用用户服务时携带 X-Internal-Token
    token: ${INTERNAL_TOKEN:}
  cos:
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-shanghai}
    bucket: ${COS_BUCKET:}
    # 预览签名 URL 有效期（秒）
    sign-expire-seconds: ${COS_SIGN_EXPIRE_SECONDS:3600}
  # Pexels 图源导入：Key 只在后端读取，不返回前端、不写入日志
  pexels:
    api-key: ${PEXELS_API_KEY:}
    api-base-url: ${PEXELS_API_BASE_URL:https://api.pexels.com/v1}
