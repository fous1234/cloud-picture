name: cloud-picture-backend

services:
  mysql:
    image: mysql:8.4
    ports:
      # 标准端口；与 yu-ai-code-mother 的容器不同时运行，应用侧沿用 yaml 默认值即可
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      # 与 JDBC 的 serverTimezone=Asia/Shanghai 保持一致，否则 create_time 会差 8 小时
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化时建库（picture_user / picture_image），仅在数据卷为空时执行
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7.4
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  nacos:
    image: nacos/nacos-server:v2.3.2
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      MODE: standalone
      TZ: Asia/Shanghai
    volumes:
      - nacos-data:/home/nacos/data

volumes:
  mysql-data:
  redis-data:
  nacos-data: