server:
  port: ${GATEWAY_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  application:
    name: picture-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      routes:
        - id: picture-user-service-auth
          uri: lb://picture-user-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: picture-user-service-admin
          uri: lb://picture-user-service
          predicates:
            - Path=/api/admin/user/**
          filters:
            - StripPrefix=1
        - id: picture-user-service-user
          uri: lb://picture-user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        - id: picture-image-service-admin
          uri: lb://picture-image-service
          predicates:
            - Path=/api/admin/image/**
          filters:
            - StripPrefix=1
        - id: picture-image-service-image
          uri: lb://picture-image-service
          predicates:
            - Path=/api/image/**
          filters:
            - StripPrefix=1
        - id: picture-ai-service-ai
          uri: lb://picture-ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1
        - id: picture-image-service-space
          uri: lb://picture-image-service
          predicates:
            - Path=/api/space/**
          filters:
            - StripPrefix=1
        - id: picture-image-service-admin-space
          uri: lb://picture-image-service
          predicates:
            - Path=/api/admin/space/**
          filters:
            - StripPrefix=1
        - id: picture-payment-service-payment
          uri: lb://picture-payment-service
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=1
        - id: picture-payment-service-admin-payment
          uri: lb://picture-payment-service
          predicates:
            - Path=/api/admin/payment/**
          filters:
            - StripPrefix=1
