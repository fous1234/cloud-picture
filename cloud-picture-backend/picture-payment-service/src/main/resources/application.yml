server:
  port: ${PAYMENT_SERVICE_PORT:8084}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  # 本地开发读取项目根目录的 .env（IDEA 与命令行都不必再配环境变量）；正式环境用真实环境变量，优先级高于该文件
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  application:
    name: picture-payment-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${PAYMENT_MYSQL_HOST:127.0.0.1}:${PAYMENT_MYSQL_PORT:3306}/${PAYMENT_MYSQL_DATABASE:picture_payment}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${PAYMENT_MYSQL_USERNAME:root}
    password: ${PAYMENT_MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

picture:
  session:
    ttl-seconds: ${SESSION_TTL_SECONDS:604800}
  auth:
    # 免登录请求白名单，格式为 "METHOD /path"；支付宝异步通知没有登录态，必须放行
    public-requests: "POST /payment/notify/alipay"
  internal:
    # 出站调用：调 image-service 内部接口时携带 X-Internal-Token
    token: ${INTERNAL_TOKEN:}
  payment:
    # mock：内置模拟支付，断网可演示；alipay：支付宝沙箱
    channel: ${PAYMENT_CHANNEL:mock}
    order-timeout-minutes: ${PAYMENT_ORDER_TIMEOUT_MINUTES:30}
    # 超时关单扫描（每分钟一次）
    close-cron: ${PAYMENT_CLOSE_CRON:0 * * * * ?}
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    # 支付宝公钥（验签用，不是应用公钥）
    public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    notify-url: ${ALIPAY_NOTIFY_URL:}
    return-url: ${ALIPAY_RETURN_URL:}