name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Run backend tests
        working-directory: cloud-picture-backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: cloud-picture-frontend
        run: npm ci
      - name: Build frontend
        working-directory: cloud-picture-frontend
        run: npm run build
